openapi: 3.0.0
info:
  title: 아이랑 - 홈 화면 API
  version: 1.0

servers:
  - url: http://localhost:8080
    description: 개발 서버

paths:
  /api/ecotourism:
    get:
      summary: 인기 역사관광지 Top5
      operationId: getHistoryTourTop5
      tags:
        - Home
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: '#/components/schemas/TourSpot'

  /api/experience:
    get:
      summary: 인기 체험관광지 Top5
      operationId: getExperienceTourTop5
      tags:
        - Home
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: '#/components/schemas/TourSpot'

  /api/nature:
    get:
      summary: 인기 자연관광지 Top5
      operationId: getNatureTourTop5
      tags:
        - Home
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items:
                  $ref: '#/components/schemas/TourSpot'

  /api/recently-opened:
    get:
      summary: 새로 생긴 곳 (30일 이내)
      operationId: getRecentlyOpened
      tags:
        - Home
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentPlace'

  /api/search:
    get:
      summary: 관광지 검색
      operationId: searchTour
      tags:
        - Search
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          description: 페이지 번호(1부터 시작).
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: 페이지당 결과 수(기본 50, 최대 100).
        - name: isStrollerRental
          in: query
          required: false
          schema:
            type: boolean
        - name: isPark
          in: query
          required: false
          schema:
            type: boolean
        - name: isToilet
          in: query
          required: false
          schema:
            type: boolean
        - name: region
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Region'
        - name: tourName
          in: query
          required: false
          schema:
            type: string
          description: 관광지 이름
        - name: depth1
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Depth1'
          description: 미지정 시 전체 카테고리(역사/자연/체험)를 대상으로 한다.
        - name: depth2
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Depth2'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResult'

  /api/my-tour:
    get:
      summary: 내 여행 목록 조회
      operationId: getMyTourList
      tags:
        - MyTour
      responses:
        '200':
          description: "성공 (정렬: 미정 → visitDate 최신순)"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyTour'
    post:
      summary: 내 여행 추가
      operationId: createMyTour
      tags:
        - MyTour
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMyTourRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMyTourResponse'

  /api/my-tour/{id}:
    delete:
      summary: 내 여행 삭제
      operationId: deleteMyTour
      tags:
        - MyTour
      parameters:
        - name: id
          in: path
          required: true
          description: 내 여행 id
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMyTourResponse'

  /api/my-tour/{id}/visit-date:
    patch:
      summary: 내 여행 방문일 수정
      operationId: updateMyTourVisitDate
      tags:
        - MyTour
      parameters:
        - name: id
          in: path
          required: true
          description: 내 여행 id
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVisitDateRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/my-tour/{id}/checklist:
    patch:
      summary: 준비물 체크리스트 수정 (전체 교체)
      operationId: updateChecklist
      tags:
        - MyTour
      parameters:
        - name: id
          in: path
          required: true
          description: 내 여행 id
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChecklistRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/my-tour/{id}/calendar:
    post:
      summary: 내 여행 항목을 톡캘린더에 등록/갱신
      operationId: registerMyTourCalendar
      tags:
        - Calendar
      description: 최초 호출 시 일정 생성, 이미 연동된 항목이면 갱신. 미동의 사용자면 428과
        authorizeUrl을 반환한다.
      parameters:
        - name: id
          in: path
          required: true
          description: 내 여행 id
          schema:
            type: integer
            format: int64
        - name: dev
          in: query
          required: false
          description: true면 동의 완료 후 로컬 개발 프론트로 콜백
          schema:
            type: boolean
      responses:
        '200':
          description: 등록/갱신 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarLinkResponse'

  /api/user:
    get:
      summary: 사용자 정보 조회
      operationId: getUserInfo
      tags:
        - User
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'

  /api/user/children:
    patch:
      summary: 자녀 정보 전체 교체
      operationId: updateChildren
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateChildrenRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /api/user/alarm:
    patch:
      summary: 알림 설정 수정 (안 보낸 필드는 유지)
      operationId: updateAlarmSetting
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlarmSettingRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

components:
  schemas:

    Depth1:
      type: string
      enum:
        - HS
        - NA
        - EX

    Depth2:
      type: string
      enum:
        - HS01
        - HS02
        - HS03
        - HS04
        - NA01
        - NA02
        - NA03
        - NA04
        - NA05
        - EX01
        - EX02
        - EX03
        - EX04
        - EX05
        - EX06
        - EX07

    Region:
      type: string
      enum:
        - SEOUL
        - BUSAN
        - DAEGU
        - INCHEON
        - GWANGJU
        - DAEJEON
        - ULSAN
        - SEJONG
        - GYEONGGI
        - GANGWON
        - CHUNGBUK
        - CHUNGNAM
        - JEONBUK
        - JEONNAM
        - GYEONGBUK
        - GYEONGNAM
        - JEJU

    TourSpot:
      type: object
      required:
        - name
        - id
        - region
        - imgUrl
        - isStrollerRental
        - isPark
        - isToilet
        - operatingHours
        - price
        - latitude
        - longitude
      properties:
        name:
          type: string
          example: "경복궁"
        id:
          type: string
          example: "264337"
        region:
          $ref: '#/components/schemas/Region'
          example: "SEOUL"
        imgUrl:
          type: string
          nullable: true
          example: "http://tong.visitkorea.or.kr/cms/resource/..."
        isStrollerRental:
          type: boolean
          example: true
        isPark:
          type: boolean
          example: true
        isToilet:
          type: boolean
          example: true
        operatingHours:
          type: string
          nullable: true
          example: "09:00~18:00"
        price:
          type: string
          nullable: true
          example: "무료"
        latitude:
          type: number
          format: double
          example: 37.5796
        longitude:
          type: number
          format: double
          example: 126.9770

    SearchResult:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TourSpot'
        page:
          type: integer
          example: 1
        size:
          type: integer
          example: 50
        totalElements:
          type: integer
          example: 123
        totalPages:
          type: integer
          example: 3

    RecentPlace:
      type: object
      required:
        - name
        - id
        - region
        - imgUrl
        - isStrollerRental
        - isPark
        - isToilet
        - isEcoTourism
        - operatingHours
        - price
        - latitude
        - longitude
      properties:
        name:
          type: string
          example: "새로운 생태관광지"
        id:
          type: string
          example: "2019720"
        region:
          $ref: '#/components/schemas/Region'
          example: "GANGWON"
        imgUrl:
          type: string
          nullable: true
        isStrollerRental:
          type: boolean
          example: false
        isPark:
          type: boolean
          example: true
        isToilet:
          type: boolean
          example: true
        isEcoTourism:
          type: boolean
          description: "생태관광지면 true, 축제면 false"
          example: true
        operatingHours:
          type: string
          nullable: true
          example: "09:00~18:00"
        price:
          type: string
          nullable: true
          example: "무료"
        latitude:
          type: number
          format: double
          example: 36.4528
        longitude:
          type: number
          format: double
          example: 127.1216
        startAt:
          type: string
          nullable: true
          description: "축제일 때만 (YYYYMMDD)"
          example: "20260701"
        endAt:
          type: string
          nullable: true
          description: "축제일 때만 (YYYYMMDD)"
          example: "20260705"

    ChecklistItem:
      type: object
      description: "체크리스트 응답 항목 (id는 서버가 매 요청마다 새로 발급)"
      required:
        - id
        - checked
        - text
      properties:
        id:
          type: integer
          format: int64
          example: 1
        checked:
          type: boolean
          example: false
        text:
          type: string
          example: "여벌 옷"

    ChecklistItemInput:
      type: object
      description: "체크리스트 수정 요청 항목 (id 없이 text·checked만 전송, 전체 교체)"
      required:
        - text
        - checked
      properties:
        text:
          type: string
          example: "여벌 옷"
        checked:
          type: boolean
          example: false

    MyTour:
      type: object
      required:
        - id
        - tourInfo
        - checklist
        - calendarLinked
      properties:
        id:
          type: integer
          format: int64
          description: "내 여행 id"
          example: 1001
        visitDate:
          type: string
          format: date
          nullable: true
          description: "방문 예정일 (미정 가능)"
          example: "2026-09-12"
        tourInfo:
          $ref: '#/components/schemas/TourSpot'
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        calendarLinked:
          type: boolean
          description: "톡캘린더에 등록되어 있는지 여부"
          example: false

    CreateMyTourRequest:
      type: object
      required:
        - tourId
      properties:
        tourId:
          type: string
          description: "각 여행지별 uuid"
          example: "264337"
        visitDate:
          type: string
          format: date
          nullable: true
          example: "2026-09-12"
        useRecommendedItems:
          type: boolean
          description: "추천 준비물을 체크리스트에 자동 추가할지 여부"
          example: false

    CreateMyTourResponse:
      type: object
      required:
        - id
        - success
      properties:
        id:
          type: integer
          format: int64
          description: "내 여행 id"
          example: 1001
        success:
          type: boolean
          example: true

    DeleteMyTourResponse:
      type: object
      required:
        - id
        - success
      properties:
        id:
          type: integer
          format: int64
          example: 1001
        success:
          type: boolean
          example: true

    UpdateVisitDateRequest:
      type: object
      properties:
        visitDate:
          type: string
          format: date
          nullable: true
          example: "2026-09-20"

    UpdateChecklistRequest:
      type: object
      required:
        - checklist
      properties:
        checklist:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItemInput'

    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true

    CalendarLinkResponse:
      type: object
      required:
        - id
        - calendarLinked
      properties:
        id:
          type: integer
          format: int64
          description: "내 여행 id"
          example: 42
        calendarLinked:
          type: boolean
          example: true

    Child:
      type: object
      required:
        - id
        - name
        - birth
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: "민준"
        birth:
          type: string
          format: date
          example: "2022-03-15"

    ChildInput:
      type: object
      description: "자녀 정보 수정 요청 항목 (id 없이 전송, 전체 교체)"
      required:
        - name
        - birth
      properties:
        name:
          type: string
          example: "민준"
        birth:
          type: string
          format: date
          example: "2022-03-15"

    UserInfo:
      type: object
      required:
        - name
        - children
        - dayBeforeTodoEnabled
        - dayAlarmEnabled
      properties:
        name:
          type: string
          description: "사용자 이름"
          example: "홍길동"
        children:
          type: array
          items:
            $ref: '#/components/schemas/Child'
        dayBeforeTodoEnabled:
          type: boolean
          description: "D-1 알림"
          example: true
        dayAlarmEnabled:
          type: boolean
          description: "당일 알림"
          example: true

    UpdateChildrenRequest:
      type: object
      required:
        - children
      properties:
        children:
          type: array
          items:
            $ref: '#/components/schemas/ChildInput'

    UpdateAlarmSettingRequest:
      type: object
      description: "부분 수정 — 보낸 필드만 반영"
      properties:
        dayBeforeTodoEnabled:
          type: boolean
        dayAlarmEnabled:
          type: boolean

tags:
  - name: Home
    description: 홈 화면 API
  - name: Search
    description: 검색 API
  - name: MyTour
    description: 내 여행 API
  - name: Calendar
    description: 카카오 톡캘린더 연동 API
  - name: User
    description: 사용자/설정 API
